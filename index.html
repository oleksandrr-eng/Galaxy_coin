<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Coin Rush</title>
<style>
:root{
  --bg:#000; --card:#161823; --card2:#1f2130; --line:rgba(255,255,255,.12);
  --text:#fff; --muted:rgba(255,255,255,.58); --cyan:#25f4ee; --red:#fe2c55; --gold:#ffc83d;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --gt:max(14px,env(safe-area-inset-top,0px)); --gb:max(16px,env(safe-area-inset-bottom,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg)}
@supports (height:100dvh){html,body{height:100dvh}}
body{color:var(--text);font:15px/1.3 "Proxima Nova",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;padding:0;background:none;cursor:pointer}
img{display:block;max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.coin{display:inline-block;flex:none;width:1em;height:1em}
.coin img{width:100%;height:100%;object-fit:contain}
.glitch{text-shadow:-2px -1px 0 var(--cyan),2px 1px 0 var(--red)}

/* Game area: one phone-sized column */
.game{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;display:flex;flex-direction:column;background:#000}
.field{position:relative;flex:1;min-height:0;overflow:hidden;background:radial-gradient(120% 60% at 50% 0%,#14162a,#000 70%)}

/* Profile on top */
.profile{cursor:pointer;position:relative;z-index:12;display:flex;align-items:center;gap:12px;padding:calc(var(--gt) - 2px) var(--gr) 12px var(--gl);background:#000;border-bottom:1px solid var(--line)}
.avatar{position:relative;flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;
  background:linear-gradient(140deg,#ffb38a,#ff5d7a 55%,#7b4dff);box-shadow:0 0 0 2px #000,0 0 0 4px var(--red)}
.avatar .live{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);padding:1px 6px;border-radius:4px;background:var(--red);
  font-weight:800;font-size:9px;letter-spacing:.06em;box-shadow:0 0 0 2px #000}
.p-info{flex:1;min-width:0;display:grid;gap:6px}
.p-name{display:flex;align-items:baseline;gap:8px;min-width:0}
.p-name b{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-name span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counts{display:flex;gap:16px}
.counts div{display:flex;align-items:baseline;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.counts b{font-size:15px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.counts .bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.25)}}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* In-game HUD */
.hud{position:absolute;left:0;right:0;top:0;z-index:2;display:grid;gap:10px;padding:12px var(--gr) 0 var(--gl);pointer-events:none}
.hud-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.score{display:flex;align-items:center;gap:8px;font-size:34px;font-weight:900;font-variant-numeric:tabular-nums}
.score .coin{width:34px;height:34px}
.time{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:rgba(22,24,35,.85);font-weight:800;font-variant-numeric:tabular-nums}
.time.low{background:var(--red)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--cyan),var(--red));transform-origin:left}
.combo{justify-self:center;padding:4px 12px;border-radius:99px;background:var(--red);font-weight:900;font-size:15px;opacity:0;transform:scale(.8);transition:.2s}
.combo.on{opacity:1;transform:none}
.hint{position:absolute;left:50%;bottom:calc(var(--gb) + 24px);z-index:2;transform:translateX(-50%);padding:8px 14px;border-radius:99px;
  background:rgba(22,24,35,.85);font-weight:700;font-size:14px;white-space:nowrap;pointer-events:none;transition:opacity .5s}
.hint.gone{opacity:0}

/* Screens over the game */
.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;
  padding:16px var(--gr) var(--gb) var(--gl);background:rgba(0,0,0,.92);animation:fade .25s}
.screen h1{margin:0;font-size:40px;font-weight:900;letter-spacing:-.5px;line-height:1}
.screen h2{margin:0;font-size:30px;font-weight:900;line-height:1.15;text-wrap:balance}
.screen p{margin:0;font-size:16px;color:var(--muted);max-width:320px}
.screen p b{color:#fff}
.actions{display:grid;gap:10px;width:min(320px,100%)}
.actions button{height:52px;border-radius:6px;font-size:17px;font-weight:800}
.primary{background:var(--red);box-shadow:-3px 0 0 var(--cyan)}
.primary:disabled{background:var(--card2);box-shadow:none;color:var(--muted);cursor:default}
.secondary{background:var(--card2);border:1px solid var(--line)}
.link{height:auto!important;padding:6px;color:var(--muted);font-weight:700!important;font-size:15px!important}

/* Character select */
.select{justify-content:flex-start;padding-top:20px;overflow-y:auto}
.select p{margin-top:-6px}
.chars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(400px,100%)}
.char{display:grid;justify-items:center;gap:6px;padding:12px 6px 10px;border-radius:12px;background:var(--card);border:2px solid transparent;transition:transform .12s}
.char:active{transform:scale(.96)}
.char.on{border-color:var(--red);background:var(--card2)}
.char .pic{position:relative;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#252838,#0b0b10 72%)}
.char.on .pic{box-shadow:-3px -2px 0 var(--cyan),3px 2px 0 var(--red)}
.char .pic img{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain}
.char b{font-size:13px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.best{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:700}

/* Countdown, results, transfer, prank */
.count{font-size:120px;font-weight:900;animation:pop .33s ease-out}
.big-pic{position:relative;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#1d1f2b,#0b0b10 72%);
  box-shadow:-6px -3px 0 var(--cyan),6px 3px 0 var(--red)}
.big-pic img{position:absolute;inset:12%;width:76%;height:76%;object-fit:contain}
.amount{display:flex;align-items:center;gap:10px;font-size:46px;font-weight:900;font-variant-numeric:tabular-nums}
.amount .coin{width:44px;height:44px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:6px 12px;border-radius:99px;background:var(--card);font-weight:700;font-size:14px;color:var(--muted)}
.chip b{color:#fff}
.spinner{width:56px;height:56px;border-radius:50%;border:5px solid rgba(255,255,255,.12);border-top-color:var(--red);border-left-color:var(--cyan);animation:spin .8s linear infinite}
.progress{width:min(280px,100%);height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--red));animation:load 1.8s ease-in-out forwards}
.prank-text{font-size:34px;font-weight:900;line-height:1.15;text-transform:uppercase;text-wrap:balance;text-shadow:-3px -1px 0 var(--cyan),3px 1px 0 var(--red)}
.confetti{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards;pointer-events:none}

@keyframes fade{from{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes load{to{width:100%}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:.2}}
</style>
</head>
<body>
<div class="game" id="game">
  <header class="profile" id="profile" role="button" tabindex="0" aria-label="Reset profile to zero">
    <div class="avatar"><span id="initials"></span><span class="live">LIVE</span></div>
    <div class="p-info">
      <div class="p-name"><b id="pName"></b><span class="acc"></span></div>
      <div class="counts">
        <div><b id="following">0</b>Following</div>
        <div><b id="followers">0</b>Followers</div>
        <div><b id="likes">0</b>Likes</div>
      </div>
    </div>
  </header>

  <div class="field" id="field">
  <canvas id="cv"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="hud-row">
      <div class="score"><span class="coin" data-coin></span><span class="glitch" id="score">0</span></div>
      <div class="time" id="timeBox">⏱ <span id="time"></span></div>
    </div>
    <div class="bar"><i id="timeBar"></i></div>
    <div class="combo" id="combo"></div>
  </div>
  <div class="hint" id="hint" hidden>Drag your finger to move</div>

  <!-- 1. choose a character -->
  <section class="screen select" id="select">
    <h1 class="glitch">Coin Rush</h1>
    <p>Pick a gift, catch the coins and the treasure chest. Dodge the meteors!</p>
    <div class="chars" id="chars"></div>
    <div class="best" id="bestRow"><span>Best:</span><span class="coin" data-coin></span><span id="best"></span></div>
    <div class="actions"><button class="primary" id="play" type="button">Play</button></div>
  </section>

  <!-- 2. 3-2-1 -->
  <section class="screen" id="countdown" hidden><div class="count glitch" id="count"></div></section>

  <!-- 3. round over -->
  <section class="screen" id="results" hidden>
    <div class="big-pic" id="resPic"></div>
    <h2>Time's up!</h2>
    <div class="amount"><span class="coin" data-coin></span><span class="glitch" id="resAmount"></span></div>
    <div class="chips"><span class="chip">Best combo <b id="resCombo"></b></span><span class="chip">Best <b id="resBest"></b></span></div>
    <div class="actions">
      <button class="primary" id="transfer" type="button">Transfer coins to account</button>
      <button class="secondary" id="again" type="button">Play again</button>
      <button class="link" id="change" type="button">Change character</button>
    </div>
  </section>

  <!-- 4. transferring -->
  <section class="screen" id="sending" hidden>
    <div class="spinner"></div>
    <h2>Transferring coins…</h2>
    <p>Sending <b id="sendAmount"></b> coins to <b class="acc"></b></p>
    <div class="progress"><i></i></div>
  </section>

  <!-- 5. congratulations -->
  <section class="screen" id="done" hidden>
    <div class="big-pic" id="donePic"></div>
    <h2>Congratulations! 🎉</h2>
    <div class="amount"><span class="coin" data-coin></span><span id="doneAmount"></span></div>
    <p>coins were transferred to <b class="acc"></b></p>
    <div class="actions">
      <button class="primary" id="again2" type="button">Play again</button>
      <button class="secondary" id="learn" type="button">Learn more</button>
    </div>
  </section>

  <!-- 6. prank reveal -->
  <section class="screen" id="prank" hidden>
    <div class="prank-text" id="prankText"></div>
    <p id="prankNote"></p>
    <div class="actions"><button class="primary" id="again3" type="button">Play again</button></div>
  </section>
  </div>
</div>

<script>
/* ============================ SETTINGS ============================ */
var CONFIG = {
  roundSeconds: 7,
  countdownSeconds: 1,                   // 3-2-1 before the round
  playerName: 'Mia',
  playerInitials: 'MV',
  account: '@mia.vibes',                 // shown on the transfer screens
  coinValue: 100,                        // normal coin
  bigCoinValue: 500,                     // large coin
  chestValue: 3000,                      // flying treasure chest (one per round)
  bombPenalty: 300,                      // coins lost when a meteor hits you
  prankText: 'Это пранк, и всё это нереально',
  prankNote: 'The coins are not real. Thanks for playing!',
  // characters to choose from: [name, picture]; picture empty = the built-in one with that name
  characters: [['Phoenix'], ['Thunder Eagle'], ['Pegasus'], ['Fire Phoenix'], ['Starship'], ['Dragon']]
};
/* ================================================================== */

document.addEventListener('DOMContentLoaded', function () {
  var MEDIA = window.MEDIA || {};
  function $(id) { return document.getElementById(id); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function num(n) { return Math.max(0, Math.floor(n)).toLocaleString('en-US'); }
  function pic(src) { return src ? '<img src="' + src + '" alt="" draggable="false">' : ''; }
  function vibrate(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
  function show(id) {
    ['select', 'countdown', 'results', 'sending', 'done', 'prank'].forEach(function (s) { $(s).hidden = s !== id; });
  }
  function load(src) { var i = new Image(); if (src) i.src = src; return i; }

  var COIN_HTML = MEDIA.coin ? pic(MEDIA.coin) : '🪙';
  document.querySelectorAll('[data-coin]').forEach(function (el) { el.innerHTML = COIN_HTML; });
  document.querySelectorAll('.acc').forEach(function (el) { el.textContent = CONFIG.account; });
  $('prankText').textContent = CONFIG.prankText;
  $('prankNote').textContent = CONFIG.prankNote;

  var CHARS = CONFIG.characters.map(function (c) {
    var src = c[1] || (MEDIA.gifts || {})[c[0]];
    return { name: c[0], src: src, img: load(src) };
  });
  var coinImg = load(MEDIA.coin), meteorImg = load(MEDIA.meteor), chestImg = load(MEDIA.chest);

  var best = 0, chosen = 0;
  try { best = +localStorage.getItem('coinRushBest') || 0; chosen = +localStorage.getItem('coinRushChar') || 0; } catch (e) {}
  if (!CHARS[chosen]) chosen = 0;

  /* ---------- Profile: Following / Followers / Likes start at 0 and grow with every coin ---------- */
  $('pName').textContent = CONFIG.playerName;
  $('initials').textContent = CONFIG.playerInitials;
  var prof = { following: 0, followers: 0, likes: 0 };
  try { var sp = JSON.parse(localStorage.getItem('coinRushProfile') || 'null'); if (sp) prof = sp; } catch (e) {}
  function short(n) {
    return n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K' : String(Math.floor(n));
  }
  function showProfile(changed) {
    ['following', 'followers', 'likes'].forEach(function (k) {
      var el = $(k), v = short(prof[k]);
      if (el.textContent !== v) { el.textContent = v; if (changed) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); } }
    });
  }
  function grow(gain) {
    prof.likes += 1;
    prof.followers += Math.ceil(gain / 25 * rand(.5, 1.5));
    if (Math.random() < .3) prof.following += 1;
    showProfile(true);
    try { localStorage.setItem('coinRushProfile', JSON.stringify(prof)); } catch (e) {}
  }
  showProfile(false);
  // tapping the profile sets Following, Followers, Likes and the best score back to 0
  function resetProfile() {
    prof = { following: 0, followers: 0, likes: 0 };
    best = 0;
    try { localStorage.setItem('coinRushProfile', JSON.stringify(prof)); localStorage.removeItem('coinRushBest'); } catch (e) {}
    showProfile(true); showBest();
    if (!$('results').hidden) $('resBest').textContent = '0';
    vibrate(15);
  }
  $('profile').addEventListener('click', resetProfile);
  $('profile').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); resetProfile(); } });

  /* ---------- Character select ---------- */
  CHARS.forEach(function (c, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'char' + (i === chosen ? ' on' : '');
    b.innerHTML = '<span class="pic">' + pic(c.src) + '</span><b>' + c.name + '</b>';
    b.addEventListener('click', function () {
      chosen = i;
      document.querySelectorAll('.char').forEach(function (el, k) { el.classList.toggle('on', k === i); });
      try { localStorage.setItem('coinRushChar', i); } catch (e) {}
    });
    $('chars').appendChild(b);
  });
  function showBest() { $('best').textContent = num(best); $('bestRow').hidden = !best; }
  showBest();

  /* ---------- Canvas ---------- */
  var cv = $('cv'), ctx = cv.getContext('2d'), W = 0, H = 0, dpr = 1;
  function resize() {
    var r = $('field').getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  var stars = [];
  for (var i = 0; i < 70; i++) stars.push({ x: Math.random(), y: Math.random(), s: rand(.5, 1.8), v: rand(.02, .08) });

  /* ---------- Game state ---------- */
  var G = null, last = 0;
  var player = { x: 0, y: 0, tx: 0, ty: 0, r: 40, tilt: 0 };

  function newRound() {
    G = { running: false, score: 0, time: CONFIG.roundSeconds, items: [], fx: [], texts: [], spawn: 0, combo: 0, lastPick: -9, bestCombo: 0, shake: 0, red: 0, t: 0,
          chestAt: rand(1.2, CONFIG.roundSeconds * .55) };   // when the treasure chest flies in
    player.r = Math.max(30, Math.min(W, H) * .11);
    player.x = player.tx = W / 2; player.y = player.ty = H * .75;
    $('score').textContent = '0';
    $('combo').classList.remove('on');
  }

  // finger / mouse moves the character; it sits a little above the finger so it stays visible
  function aim(e) {
    if (!G || !G.running) return;
    var r = cv.getBoundingClientRect(), p = e.touches ? e.touches[0] : e;
    if (!p) return;
    player.tx = p.clientX - r.left;
    player.ty = p.clientY - r.top - (e.pointerType === 'mouse' ? 0 : player.r * 1.1);
    $('hint').classList.add('gone');
  }
  if (window.PointerEvent) { cv.addEventListener('pointerdown', aim); cv.addEventListener('pointermove', aim); }
  else { cv.addEventListener('touchstart', aim, { passive: true }); cv.addEventListener('touchmove', aim, { passive: true }); cv.addEventListener('mousemove', aim); }
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  function spawnItem() {
    var t = 1 - G.time / CONFIG.roundSeconds, roll = Math.random(), it;           // t: 0 at start, 1 at the end
    if (roll < (G.t > 1.5 ? .08 + t * .06 : 0)) it = { kind: 'bomb', r: 24 };
    else if (roll < .3) it = { kind: 'big', r: 26, value: CONFIG.bigCoinValue };
    else it = { kind: 'coin', r: 17, value: CONFIG.coinValue };
    it.x = rand(it.r, W - it.r); it.y = -it.r;
    it.vy = rand(150, 230) * (1 + t * .9); it.vx = rand(-30, 30);
    it.spin = rand(0, 6);
    G.items.push(it);
  }

  function floatText(x, y, text, color) { G.texts.push({ x: x, y: y, text: text, color: color, life: 1 }); }
  function burst(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = rand(0, Math.PI * 2), s = rand(60, 220);
      G.fx.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color: color, r: rand(2, 4) });
    }
  }

  function pick(it) {
    if (it.kind === 'chest') {
      G.score += it.value;
      floatText(it.x, it.y - it.r, 'CHEST +' + num(it.value), '#ffc83d');
      burst(it.x, it.y, '#ffc83d', 40); burst(it.x, it.y, '#25f4ee', 12); burst(it.x, it.y, '#fe2c55', 12);
      for (var k = 0; k < 10; k++) G.fx.push({ coin: true, x: it.x, y: it.y, vx: rand(-260, 260), vy: rand(-420, -160), life: 1.3, r: rand(10, 16) });
      grow(it.value); G.shake = .15;
      vibrate([20, 30, 20, 30, 60]);
    } else if (it.kind === 'bomb') {
      G.score = Math.max(0, G.score - CONFIG.bombPenalty);
      G.combo = 0; G.shake = .35; G.red = .5;
      floatText(it.x, it.y, '-' + num(CONFIG.bombPenalty), '#fe2c55');
      burst(it.x, it.y, '#fe2c55', 18);
      vibrate([40, 30, 40]);
    } else {
      G.combo = G.t - G.lastPick < .9 ? G.combo + 1 : 1;
      G.lastPick = G.t;
      G.bestCombo = Math.max(G.bestCombo, G.combo);
      var mult = Math.min(5, 1 + Math.floor(G.combo / 5)), gain = it.value * mult;
      G.score += gain;
      floatText(it.x, it.y, '+' + num(gain), mult > 1 ? '#25f4ee' : '#fff');
      grow(gain);
      burst(it.x, it.y, it.kind === 'big' ? '#ffc83d' : '#ffe08a', it.kind === 'big' ? 14 : 7);
      vibrate(6);
    }
    $('score').textContent = num(G.score);
    var m = Math.min(5, 1 + Math.floor(G.combo / 5));
    $('combo').textContent = 'Combo ' + G.combo + (m > 1 ? ' · x' + m : '');
    $('combo').classList.toggle('on', G.combo >= 3);
  }

  /* ---------- Loop ---------- */
  function frame(now) {
    var dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
    if (G && G.running) update(dt);
    draw(dt);
    requestAnimationFrame(frame);
  }

  function update(dt) {
    G.t += dt; G.time -= dt;
    if (G.time <= 0) { G.time = 0; endRound(); return; }
    var t = 1 - G.time / CONFIG.roundSeconds;
    G.spawn -= dt;
    if (G.spawn <= 0) { spawnItem(); G.spawn = .24 - t * .1; }
    if (G.chestAt && G.t >= G.chestAt) {               // a chest drifts across space from one side to the other
      G.chestAt = 0;
      var left = Math.random() < .5, cr = Math.max(34, W * .11);
      G.items.push({ kind: 'chest', r: cr, value: CONFIG.chestValue, x: left ? -cr : W + cr, y: rand(H * .3, H * .55), baseY: 0,
                     vx: (left ? 1 : -1) * W / 2.6, vy: 0, spin: 0 });
      G.items[G.items.length - 1].baseY = G.items[G.items.length - 1].y;
    }

    var px = player.x;
    player.x += (player.tx - player.x) * Math.min(1, dt * 14);
    player.y += (Math.max(H * .15, Math.min(H - player.r, player.ty)) - player.y) * Math.min(1, dt * 14);
    player.x = Math.max(player.r * .6, Math.min(W - player.r * .6, player.x));
    player.tilt += ((player.x - px) / dt * .0012 - player.tilt) * Math.min(1, dt * 10);
    player.tilt = Math.max(-.45, Math.min(.45, player.tilt));

    for (var i = G.items.length - 1; i >= 0; i--) {
      var it = G.items[i];
      it.x += it.vx * dt; it.spin += dt * 5;
      if (it.kind === 'chest') it.y = it.baseY + Math.sin(it.spin * .8) * 26;
      else { it.y += it.vy * dt; if (it.x < it.r || it.x > W - it.r) it.vx *= -1; }
      var dx = it.x - player.x, dy = it.y - player.y;
      if (dx * dx + dy * dy < Math.pow(player.r * .8 + it.r, 2)) { pick(it); G.items.splice(i, 1); continue; }
      if (it.y > H + it.r || (it.kind === 'chest' && (it.x < -it.r * 2 || it.x > W + it.r * 2))) G.items.splice(i, 1);
    }
    if (G.t - G.lastPick > .9 && G.combo) { G.combo = 0; $('combo').classList.remove('on'); }

    $('time').textContent = Math.ceil(G.time) + 's';
    $('timeBox').classList.toggle('low', G.time < 6);
    $('timeBar').style.transform = 'scaleX(' + (G.time / CONFIG.roundSeconds) + ')';
  }

  function drawCoin(x, y, r, spin) {
    var sx = Math.abs(Math.cos(spin)) * .75 + .25;
    ctx.save(); ctx.translate(x, y); ctx.scale(sx, 1);
    ctx.shadowColor = 'rgba(255,200,61,.7)'; ctx.shadowBlur = r * .8;
    if (coinImg.complete && coinImg.naturalWidth) ctx.drawImage(coinImg, -r, -r, r * 2, r * 2);
    else { ctx.fillStyle = '#ffc83d'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); }
    ctx.restore();
  }

  function draw(dt) {
    ctx.clearRect(0, 0, W, H);
    // stars drifting down
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    stars.forEach(function (s) {
      s.y += s.v * dt * (G && G.running ? 3 : 1); if (s.y > 1) { s.y = 0; s.x = Math.random(); }
      ctx.fillRect(s.x * W, s.y * H, s.s, s.s * 2.5);
    });
    if (!G) return;

    ctx.save();
    if (G.shake > 0) { G.shake -= dt; ctx.translate(rand(-8, 8) * G.shake * 3, rand(-8, 8) * G.shake * 3); }

    G.items.forEach(function (it) {
      if (it.kind === 'bomb') {
        // meteor: the picture's head points down-right (45°), so turn it to face where it is flying;
        // the rock (hit area) sits at the item position and the fiery tail trails behind
        var size = it.r * 3.4, ang = Math.atan2(it.vy, it.vx) - Math.PI / 4;
        ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(ang);
        if (meteorImg.complete && meteorImg.naturalWidth) ctx.drawImage(meteorImg, -size * .78, -size * .78, size, size);
        else { ctx.fillStyle = '#ff6a2b'; ctx.beginPath(); ctx.arc(0, 0, it.r, 0, 7); ctx.fill(); }
        ctx.restore();
      } else if (it.kind === 'chest') {
        var cw = it.r * 2.6, ch = cw * (chestImg.naturalHeight / chestImg.naturalWidth || .6);
        ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(Math.sin(it.spin * 1.3) * .08);
        var glow = ctx.createRadialGradient(0, 0, 4, 0, 0, it.r * 1.6);
        glow.addColorStop(0, 'rgba(255,200,61,.55)'); glow.addColorStop(1, 'rgba(255,200,61,0)');
        ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, 0, it.r * 1.6, 0, 7); ctx.fill();
        if (chestImg.complete && chestImg.naturalWidth) ctx.drawImage(chestImg, -cw / 2, -ch / 2, cw, ch);
        ctx.restore();
      } else drawCoin(it.x, it.y, it.r, it.spin);
    });

    // the player: two-tone glow, then the gift picture
    var c = CHARS[chosen], r = player.r;
    ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.tilt);
    ctx.globalAlpha = .55;
    ctx.fillStyle = '#25f4ee'; ctx.beginPath(); ctx.arc(-4, -2, r * .82, 0, 7); ctx.fill();
    ctx.fillStyle = '#fe2c55'; ctx.beginPath(); ctx.arc(4, 2, r * .82, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#0d0e15'; ctx.beginPath(); ctx.arc(0, 0, r * .8, 0, 7); ctx.fill();
    if (c.img.complete && c.img.naturalWidth) ctx.drawImage(c.img, -r, -r * 1.05, r * 2, r * 2);
    ctx.restore();

    G.fx = G.fx.filter(function (p) {
      p.life -= dt * 1.8; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.coin ? 700 : 300) * dt;
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      if (p.coin) drawCoin(p.x, p.y, p.r, p.life * 12);
      else { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
      return p.life > 0;
    });
    ctx.globalAlpha = 1;
    ctx.font = '900 24px system-ui,sans-serif'; ctx.textAlign = 'center';
    G.texts = G.texts.filter(function (t) {
      t.life -= dt * 1.4; t.y -= 60 * dt;
      ctx.globalAlpha = Math.max(0, t.life);
      ctx.fillStyle = '#25f4ee'; ctx.fillText(t.text, t.x - 2, t.y - 1);
      ctx.fillStyle = '#fe2c55'; ctx.fillText(t.text, t.x + 2, t.y + 1);
      ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
      return t.life > 0;
    });
    ctx.globalAlpha = 1;
    ctx.restore();

    if (G.red > 0) { G.red -= dt; ctx.fillStyle = 'rgba(254,44,85,' + Math.max(0, G.red * .5) + ')'; ctx.fillRect(0, 0, W, H); }
  }
  requestAnimationFrame(function (t) { last = t; frame(t); });

  /* ---------- Round flow ---------- */
  function startRound() {
    resize(); newRound();
    $('hud').hidden = false; $('hint').hidden = false; $('hint').classList.remove('gone');
    $('time').textContent = CONFIG.roundSeconds + 's'; $('timeBar').style.transform = '';
    show('countdown');
    var n = 3;
    (function tick() {
      if (n === 0) { show(null); G.running = true; return; }
      $('count').textContent = n;
      $('count').style.animation = 'none'; void $('count').offsetWidth; $('count').style.animation = '';
      n--; setTimeout(tick, CONFIG.countdownSeconds * 1000 / 3);
    })();
  }
  function endRound() {
    G.running = false;
    if (G.score > best) { best = G.score; try { localStorage.setItem('coinRushBest', best); } catch (e) {} }
    showBest();
    $('resPic').innerHTML = pic(CHARS[chosen].src);
    $('donePic').innerHTML = pic(CHARS[chosen].src);
    $('resAmount').textContent = num(G.score);
    $('resCombo').textContent = G.bestCombo;
    $('resBest').textContent = num(best);
    $('transfer').disabled = G.score <= 0;
    $('hud').hidden = true; $('hint').hidden = true;
    show('results');
    vibrate([30, 40, 30]);
  }
  function confetti() {
    var box = $('done'), colors = ['#25f4ee', '#fe2c55', '#fff', '#ffc83d'];
    for (var i = 0; i < 40; i++) {
      var c = document.createElement('i');
      c.className = 'confetti';
      c.style.left = rand(0, 100) + '%'; c.style.background = colors[i % 4];
      c.style.animationDuration = rand(1.6, 3) + 's'; c.style.animationDelay = rand(0, .6) + 's';
      c.addEventListener('animationend', function () { this.remove(); });
      box.appendChild(c);
    }
  }

  $('play').addEventListener('click', startRound);
  $('again').addEventListener('click', startRound);
  $('again2').addEventListener('click', startRound);
  $('again3').addEventListener('click', startRound);
  $('change').addEventListener('click', function () { G = null; show('select'); });
  $('transfer').addEventListener('click', function () {
    var amount = num(G.score);
    $('sendAmount').textContent = amount; $('doneAmount').textContent = amount;
    var bar = $('sending').querySelector('.progress i');
    bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = '';
    show('sending');
    setTimeout(function () { show('done'); confetti(); vibrate([30, 50, 30]); }, 1900);
  });
  $('learn').addEventListener('click', function () { show('prank'); });
});
</script>
